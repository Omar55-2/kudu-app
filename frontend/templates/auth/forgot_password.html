{% extends "base.html" %}
{% block title %}Forgot Password &mdash; Kudu Ticketing{% endblock %}

{% block auth_content %}
<div class="bg-white rounded-3xl p-10 shadow-2xl max-w-[420px] mx-auto">
  <div class="flex items-center gap-2 mb-6">
    <img src="https://play-lh.googleusercontent.com/m-AAl7wF2XWb-k-RnXZgRGWxSweAxY49dz2yDDgbDjmK_2X4bCN-8YSPM21FxjAgXQU" class="w-7 h-7 rounded-lg">
    <span class="font-extrabold text-[15px] text-gray-900">{{ brand_name }}</span>
  </div>

  <div class="w-14 h-14 rounded-2xl bg-orange-50 text-[#ff6337] flex items-center justify-center mb-4">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
  </div>

  <h1 class="text-[20px] font-bold text-gray-900 mb-1">Forgot your password?</h1>
  <p class="text-[13px] text-gray-500 mb-6">Enter the email on your account and we'll send you a reset link.</p>

  <form method="POST" class="flex flex-col gap-4">
    <div>
      <label class="block text-[12px] font-semibold text-gray-500 mb-1.5">Email</label>
      <input type="email" name="email" placeholder="you@kudu.com" required autofocus
        class="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:ring-2 focus:ring-[#ff6337]/20 focus:border-[#ff6337]">
    </div>
    <button type="submit" class="w-full py-2.5 bg-[#ff6337] text-white text-[14px] font-semibold rounded-xl hover:bg-[#e5522c] transition-colors shadow-sm">Send email</button>
  </form>

  <a href="{{ url_for('auth.login') }}" class="flex items-center justify-center gap-1.5 mt-5 text-[13px] text-gray-500 hover:text-gray-800">&larr; Back to login</a>
</div>
{% endblock %}
