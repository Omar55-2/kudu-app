{% extends "base.html" %}
{% block title %}Reset Password &mdash; Kudu Ticketing{% endblock %}

{% block auth_content %}
<div class="bg-white rounded-3xl p-10 shadow-2xl max-w-[420px] mx-auto">
  <div class="flex items-center gap-2 mb-6">
    <img src="https://play-lh.googleusercontent.com/m-AAl7wF2XWb-k-RnXZgRGWxSweAxY49dz2yDDgbDjmK_2X4bCN-8YSPM21FxjAgXQU" class="w-7 h-7 rounded-lg">
    <span class="font-extrabold text-[15px] text-gray-900">{{ brand_name }}</span>
  </div>

  <div class="w-14 h-14 rounded-2xl bg-orange-50 text-[#ff6337] flex items-center justify-center mb-4">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>

  <h1 class="text-[20px] font-bold text-gray-900 mb-1">Reset password</h1>
  <p class="text-[13px] text-gray-500 mb-6">Please set your new password.</p>

  <form method="POST" class="flex flex-col gap-4">
    <div>
      <label class="block text-[12px] font-semibold text-gray-500 mb-1.5">New password</label>
      <div class="relative">
        <input type="password" id="password" name="password" minlength="8" required autofocus
          class="w-full px-3.5 py-2.5 pr-10 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:ring-2 focus:ring-[#ff6337]/20">
        <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" data-target="password" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div>
      <label class="block text-[12px] font-semibold text-gray-500 mb-1.5">Re-enter password</label>
      <div class="relative">
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required
          class="w-full px-3.5 py-2.5 pr-10 border border-gray-200 rounded-xl text-[14px] focus:outline-none focus:ring-2 focus:ring-[#ff6337]/20">
        <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" data-target="confirm_password" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="w-full py-2.5 bg-[#ff6337] text-white text-[14px] font-semibold rounded-xl hover:bg-[#e5522c] transition-colors shadow-sm">Update password</button>
  </form>
</div>
{% include "auth/_password_toggle_script.html" %}
{% endblock %}
